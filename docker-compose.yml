services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swimplan
      POSTGRES_PASSWORD: swimplan
      POSTGRES_DB: swimplan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swimplan"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://swimplan:swimplan@db:5432/swimplan?sslmode=disable"
      JWT_SECRET: "docker-dev-secret-change-me"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
